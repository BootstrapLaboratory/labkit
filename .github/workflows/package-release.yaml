name: package-release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Confirm live npm publishing when the release workflow is enabled.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-packages:
    if: >
      vars.RUSH_DELIVERY_PACKAGE_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.confirm_publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Run Rush Delivery package release
        uses: BootstrapLaboratory/rush-delivery@v0.6.1
        with:
          entrypoint: release-packages
          dry-run: "false"
          toolchain-image-provider: off
          rush-cache-provider: off
          release-env: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
